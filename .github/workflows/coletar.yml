name: Coleta

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6h, minuto fora da hora cheia (menos fila no GitHub)
  workflow_dispatch: {} # botão "Run workflow" pra rodar na hora, quando quiser testar

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CONTATO_EMAIL: ${{ vars.CONTATO_EMAIL }}
  INTERVALO_MINIMO_SEGUNDOS: "2"
  RESPEITAR_ROBOTS: "1"

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[navegador,listas]"
      - run: python -m coletor migrar

  caixa:
    needs: migrar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[navegador,listas]"
      - run: python -m coletor coletar caixa

  # Descobre sozinho todas as fontes de bancos/órgãos e de leiloeiros (um YAML = uma fonte,
  # em coletor/fontes/bancos/ e coletor/fontes/leiloeiros/) e reparte em grupos paralelos de
  # 5, cada um em sua própria máquina. Não precisa mais editar esta lista à mão quando uma
  # fonte nova aparece (ex.: via `catalogo criar-fontes`) — ela entra sozinha na próxima rodada.
  listar:
    needs: migrar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.montar.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: montar
        working-directory: coletor/fontes
        run: |
          python3 << 'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os

          arquivos = sorted(glob.glob("bancos/*.yaml") + glob.glob("leiloeiros/*.yaml"))
          ids = [os.path.splitext(os.path.basename(a))[0] for a in arquivos]

          tamanho = 5
          grupos = [
              {"nome": f"grupo{i // tamanho + 1}", "fontes": " ".join(ids[i:i + tamanho])}
              for i in range(0, len(ids), tamanho)
          ]

          print("matrix=" + json.dumps(grupos))
          EOF

  leiloeiros:
    needs: listar
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        grupo: ${{ fromJson(needs.listar.outputs.matrix) }}
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[navegador,listas]"
      - run: playwright install --with-deps chromium
      - name: Coletar ${{ matrix.grupo.nome }}
        run: python -m coletor coletar ${{ matrix.grupo.fontes }}

  geocodificar:
    needs: [caixa, leiloeiros]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: coletor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[navegador,listas]"
      - run: python -m coletor geocodificar
