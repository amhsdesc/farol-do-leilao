name: Coleta

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6h, minuto fora da hora cheia (menos fila no GitHub)
  workflow_dispatch: {} # botão "Run workflow" pra rodar na hora, quando quiser testar

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: coletor
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONTATO_EMAIL: ${{ vars.CONTATO_EMAIL }}
      INTERVALO_MINIMO_SEGUNDOS: "2"
      RESPEITAR_ROBOTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[navegador,listas]"
      - run: playwright install --with-deps chromium
      - run: python -m coletor migrar
      - run: python -m coletor coletar --todas
      - run: python -m coletor geocodificar
