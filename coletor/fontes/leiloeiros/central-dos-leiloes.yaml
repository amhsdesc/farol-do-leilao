# Criado pelo catálogo (2026-09-28). Validação: pendente.
# Tipo automático (IA). Se o volume passar de ~50 lotes, rode `inspecionar` e troque por json_api/seletores.
id: central-dos-leiloes
nome: Central dos Leilões
site: https://www.centraldosleiloes.com.br
tipo: automatico
uf: [todas]
inicio:
  - https://www.centraldosleiloes.com.br/lotes/imovel
max_paginas_lista: 10
max_lotes: 400
navegador: false
# Plataforma "/item/<id>/detalhes": leitura sem IA em estruturado.ler_itemleilao. Os lotes aparecem na home e nas listas de cada leilão.
padrao_link_lote: '/item/\d+/detalhes'
padrao_link_lista: '/leilao/\d+/lotes|/lotes/imovel'
sem_query_lote: true
