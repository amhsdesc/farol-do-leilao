# Mega Leilões. Sem IA e sem navegador: a listagem é HTML comum (48 imóveis por página) e o card já traz
# valor, tipo, cidade, UF, código, praça, situação e data. Cobre também os imóveis do Santander e de outros
# comitentes que leiloam por aqui.
id: mega-leiloes
nome: Mega Leilões
site: https://www.megaleiloes.com.br
tipo: seletores
uf: [todas]
intervalo_segundos: 1
max_segundos: 2400   # fonte grande: ~1 lote/s para gravar no banco; o padrão (1200 s) cortava a fila no meio
listagem:
  url: https://www.megaleiloes.com.br/imoveis?pagina={pagina}
  pagina_inicial: 1
  paginas_max: 40
  item: "div[data-key]"
  link: {css: "a.card-title", attr: href, regex: "^([^?]+)"}
  campos:
    id_externo: {css: ".card-number"}
    url: {css: "a.card-title", attr: href, regex: "^([^?]+)"}
    titulo: {css: "a.card-title"}
    tipo: {css: "a.card-title", attr: href, regex: "/imoveis/([a-z-]+)/"}   # categoria da URL (a 1ª palavra do título erra: "Direitos sobre terreno")
    cidade: {css: ".card-locality", regex: "^(.*),"}
    uf: {css: ".card-locality", regex: ",\\s*([A-Z]{2})$"}
    modalidade: {css: ".card-instance-title a"}
    status: {css: ".card-status"}
    lance_minimo: {css: ".card-price"}
    data_praca1: {css: ".card-first-instance-date", regex: "(\\d{2}/\\d{2}/\\d{4}[^\\n]*)"}
    valor_praca1: {css: ".instance .card-instance-value"}
    data_praca2: {css: ".card-second-instance-date", regex: "(\\d{2}/\\d{2}/\\d{4}[^\\n]*)"}
    valor_praca2: {css: ".instance + .instance .card-instance-value"}
    fotos: {css: "a[data-bg]", attr: data-bg, todos: true}   # miniatura do card (CDN da Mega, 320x240)
# Página do lote: só para o que o card não traz (comitente, leiloeiro, matrícula, cartório e o dossiê do Santander,
# que permite juntar o lote com o da fonte santander-imoveis). Lida uma vez e guardada por 30 dias (pagina_cache);
# no máximo 350 páginas novas por coleta, para não pesar no site.
detalhe:
  cache_dias: 30
  max_por_execucao: 350
  campos:
    comitente: {css: ".author.item:-soup-contains('Comitente') .value"}
    leiloeiro: {css: ".author.item:-soup-contains('Leiloeiro') .value", regex: "^(.+?)(?:\\s+JUC\\w*.*)?$"}
    matricula: {texto_regex: "Matr[íi]cula\\(s\\):\\s*([\\d.]*\\d)"}
    cartorio: {texto_regex: "Cart[óo]rio:\\s*([^.]+?)\\s*\\."}
    dossie: {texto_regex: "Dossi[eê]:\\s*(\\d{2}\\.\\d+)"}
