[project]
name = "hasta-coletor"
version = "0.1.0"
description = "Motor de coleta do agregador Hasta"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
navegador = ["playwright>=1.44"]
listas = ["openpyxl>=3.1", "pdfplumber>=0.11"]
dev = ["pytest>=8.0"]

[project.scripts]
hasta = "coletor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coletor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
